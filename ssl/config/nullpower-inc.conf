
$HTTP["scheme"] == "https" {
    setenv.add-response-header  = ( "Strict-Transport-Security" => "max-age=63072000; includeSubdomains; preload")
    setenv.add-response-header  += ( "X-Frame-Options" => "DENY")
 }

$HTTP["host"] =~ "nullpower.f5.si" {

    server.document-root = "/volNAS/Disk1/share/public_html"
    server.errorlog = "/var/log/lighttpd/nullpower-error.log"
#    accesslog.filename ="/var/log/lighttpd/nullpower-access.log"
    server.tag = "Server"


    $SERVER["socket"] == ":443" {
        server.name = "nullpower.f5.si"
        #server.document-root = "/volNAS/Disk1/share/public_html"
        #server.errorlog = "/var/log/lighttpd/nullpower-ssl-error.log"

   
        ssl.engine  = "enable"
        ssl.use-compression = "disable"
#        ssl.openssl.ssl-conf-cmd = ("Protocol" => "ALL, -SSLv2, -SSLv3, -TLSv1, -TLSv1.1")
    
    # pemfile is cert+privkey, ca-file is the intermediate chain in one file
        #ssl.privkey = "/etc/lighttpd/ssl/" + server.name + "_privkey.pem
        ssl.pemfile = "/etc/lighttpd/ssl/" + server.name + "_combined.pem"
        ssl.ca-file = "/etc/lighttpd/ssl/" + server.name + "_fullchain.pem"
                
    # intermediate configuration
        #ssl.ec-curve = "secp384r1"
        ssl.cipher-list = "EECDH+AESGCM:EDH+AESGCM:AES128+EECDH:AES128+EDH:HIGH:!aNULL:!eNULL:!EXPORT:!DES:!MD5:!PSK:!RC4:!SSLv3"

        #ssl.cipher-list = "ALL:!aNULL:!SSLv3"
#        ssl.cipher-list = "AES256+SHA384:!RC4:HIGH:!MD5:!aNULL:!DSS:!EDH:!SSLv3"
#        ssl.honor-cipher-order = "enable"
               
        ssl.use-sslv2 = "disable"
#        ssl.use-sslv3 = "disable"

#        ssl.cipher-list = "ECDH+AESGCM:DH+AESGCM:ECDH+AES256:DH+AES256:!aNULL:!MD5:!DSS:!RC4:!SSLv3"
#        ssl.honor-cipher-order = "enable"



        #ssl.honor-cipher-order = "disable"
        #ssl.cipher-list = "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384"
    }
}
