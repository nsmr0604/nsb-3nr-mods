server {
        listen   80;
        server_name x00.f5.si nullpower.f5.si *.nullpower.f5.si;
        root   /volNAS/Disk1/.html;
        # Keep temp files off of flash
        client_body_temp_path /tmp/nginx;
        proxy_temp_path /tmp/nginx/proxy 1 2; 
        fastcgi_temp_path /tmp/nginx/fastcgi-temp;
        # use only memory for buffering, no disk files
        fastcgi_buffers 256 4k;
        fastcgi_max_temp_file_size 0;
        fastcgi_ignore_client_abort off;

        location / {
                index  index.pl index.html index.htm;
		autoindex on;
        }
        location ~ ^/\.well-known/([-_a-zA-Z0-9]+)$ {
              #default_type text/plain;
              #return 200 "$1.w4HMHsL-Vfxkod8wNq9YW0YP3y1apMsgiOBTAIPfnrM";
              root    /var/tmp;
        }
        location ~ \.pl|cgi$ {
                gzip off;
                fastcgi_pass  unix:/tmp/cgi.sock;
                fastcgi_index index.pl;
                fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
                include /etc/nginx/fastcgi_params;
        }
access_log  /tmp/nginx/access_nullpower.log;
}
